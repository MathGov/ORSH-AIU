name: Publication checks and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-numerics.txt
      - run: python scripts/verify_publication.py
      - run: python scripts/check_numerics.py
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONUTF8: '1'
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: |
          curl --fail --location --retry 3 https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-linux-amd64.tar.gz -o /tmp/pandoc.tar.gz
          tar -xzf /tmp/pandoc.tar.gz -C /tmp
          echo '/tmp/pandoc-3.1.11.1/bin' >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements-site.txt
      - run: npm ci --ignore-scripts
      - run: python scripts/build_site.py
      - run: python scripts/check_site.py
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, site]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
